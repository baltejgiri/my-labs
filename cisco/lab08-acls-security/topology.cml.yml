    configuration:
      - name: node.cfg
        content: |-
          # this is a shell script which will be sourced at boot
          hostname Server1
          # configurable user account
          USERNAME=cisco
          PASSWORD=cisco
          ip address add 172.16.1.100/24 dev eth0
          ip link set dev eth0 up
          ip route add default via 172.16.1.1
          # lab services: a web page on TCP 80 and an FTP-style banner on TCP 21
          mkdir -p /tmp/www && echo "Server1 web page" > /tmp/www/index.html
          httpd -p 80 -h /tmp/www
          (while true; do echo "220 Server1 FTP ready" | nc -l -p 21; done) &
